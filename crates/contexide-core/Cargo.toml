[package]
name = "contexide-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "contexide_core"
doctest = true

[dependencies]
# Pull versions from the workspace to avoid duplicate builds
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
blake3 = { workspace = true }
anyhow = { workspace = true }
async-trait.workspace = true
bytes = { workspace = true }
futures = { workspace = true }
# Optional heavy deps (gate them)
sqlx = { workspace = true, optional = true, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "time"] }

[features]
default = []
db = ["sqlx"]
