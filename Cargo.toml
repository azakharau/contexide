[workspace]
resolver = "2"
members = [
  "crates/contexide-core",
  "crates/contexide-config",
  "crates/contexide-messaging-nats",
  "crates/contexide-blob-storage-s3",
  "crates/contexide-vector-qdrant",
  "crates/contexide-storage-pg",
  "crates/contexide-chunker-impl",
  "crates/contexide-normalizer",
  "crates/contexide-extractor",
  "crates/contexide-embeddings",
  "crates/contexide-indexer",
  "crates/contexide-worker-runtime",
  "crates/contexide-workers",
  "crates/contexide-workflow-core",
  "crates/contexide-workflow-executor",
  "crates/contexide-workflow-profiles",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/azakharau/contexide"

[workspace.dependencies]
# Async runtime & utilities
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "fs",
] }
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"
once_cell = "1"
async-trait = "0.1.89"

# Web
axum = { version = "0.8.4", features = ["macros"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = [
  "cors",
  "trace",
  "auth",
  "propagate-header",
] }
http = "1.3"
hyper = { version = "1", features = ["http1", "http2", "server"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
http-body = "1"
http-body-util = "0.1"
futures-util = "0.3"
url = "2"
urlencoding = "2"

# Data & DB
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["macros", "time_0_3"] }
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
  "json",
  "time",
] }
pgvector = { version = "0.4", features = ["sqlx"] }
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
time = { version = "0.3", features = ["serde", "macros"] }
regex = "1"
tokio-util = "0.7"
qdrant-client = "1"
async-nats = { version = "0.42" }

# Messaging (NATS JetStream)
# Object storage (MinIO / S3-compatible)
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", features = ["http-1x"] }

# Auth / security
jsonwebtoken = { version = "9" }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }
# opentelemetry can be added later if needed

# Parsing & extraction (used by specific workers)
encoding_rs = "0.8"
scraper = "0.24"
html5ever = "0.35"
roxmltree = "0.20"
html2text = "0.*"
# PDF / OCR / ASR / Video
lopdf = "0.38"                                        # basic PDF text extraction
leptess = "0.14"                                      # Tesseract OCR bindings
whisper-rs = "0.15"                                   # speech-to-text
ffmpeg-next = { version = "8", features = ["build"] }

# Tokenization / text utils
unicode-normalization = "0.1"
tiktoken-rs = "0.7"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

# CLI & config
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["env", "yaml"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
mime = "0.3"
mime_guess = "2"

aws-credential-types = "1"
infer = "*"
pdf-extract = "*"
bytecount = "0.6"
pulldown-cmark = "0.13"
ahash = "0.8"
strum = { version = "*", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.metadata.sqlx]
offline = true
